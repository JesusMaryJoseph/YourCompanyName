<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    

    <script>
		function addListenerToInputs(){
			const inputTags = querySelectorAll("input");
            //alert("# of Inputs = " + inputTags.length);
            console.log("# of Inputs = " + inputTags.length);
			inputTags.forEach( item => {
				item.addEventListener("keydown", PracticeTruthTableManager.checkInput());
			})
		}
	</script>
    
    <style>
        .edu-contents{
			height: 85vh;
			width:93vw;
			position: relative;
			/*left: 2rem;*/
            background-image: url("media/imgs/low-noise-darker.png");
            background-size: cover;
            color:  black;
			overflow: auto;
			/*border: 3px solid green;*/ 
        }
        
        
    </style>
</head>
<body onload="gatesIcsInit()">
    <div class="gates-ics-body-container">
        <div id="gates-ics-contents-id" class="contents gates-ics-contents">
            <h2 class="header-two">Basic Logic Gates:</h2>
            <section class="not-and-or-gates">
                <div class="basic-selection-show-container">
                    <div class="gate-selection-container" colspan="4">
                        <label id="and-label-id" class="selected-gate" onclick="TableGenerator.createTable('basic-practice-table-id',JsonTableDataPractice74LS08)">AND</label>
                        <label id="or-label-id" onclick="TableGenerator.createTable('basic-practice-table-id',JsonTableDataPractice74LS32)">OR</label>
                        <label id="xor-label-id" onclick="TableGenerator.createTable('basic-practice-table-id',JsonTableDataPractice74LS86)">XOR</label>
                        <label id="nand-label-id" onclick="TableGenerator.createTable('basic-practice-table-id',JsonTableDataPractice74LS00)">NAND</label>
                        <label id="nor-label-id" onclick="TableGenerator.createTable('basic-practice-table-id',JsonTableDataPractice74LS02)">NOR</label>
                        <label id="nxor-label-id" onclick="TableGenerator.createTable('basic-practice-table-id',JsonTableDataPractice74LS266)">NXOR</label>
                    </div>
                    <!--div class="show-basic-solution-container">
                        <label id="show-basic-solution-id" class="show-solution-label" onclick="PracticeTruthTableManager.showSolution('basic')">Show<br>Solution</label>
                    </div>-->               
                </div>

                <div id="basic-table-container-id" class="table-container">
                    <table id="basic-practice-table-id" class="truth-table basic-table" style="border-collapse: collapse">

                    </table>
                </div><br><br>

                <div class="select-data-type-outer-container">
                    <div class="select-data-type-container">
                        <label>Data Type:</label>
                        <div class="radio-inputs-container">
                            <input type="radio" name="data-type-inputs" value="FT" checked  onclick="TableGenerator.changeDataType(0)">
                            <label for="FT">FT</label>
                            <input type="radio" name="data-type-inputs" value="01" onclick="TableGenerator.changeDataType(1)">
                            <label for="01">01</label>
                            <input type="radio" name="data-type-inputs" value="LH"  onclick="TableGenerator.changeDataType(2)">
                            <label for="LH">LH</label>
                        </div>
                    </div>
                </div>
                <p>The following table will allow you to practice with circuits containing combinations of the Basic Logic Gates.
                </p><br>
                <div class="circuit-selection-show-container">
                    <div class="circuit-selection-container">
                        <img id="NotXor-id" class="circuit-selected" src="media/imgs/basicLogicGates/NotXor_wPQ-3.5mm.svg" onclick="TableGenerator.createTable('circuit-practice-table-id',JsonTableDataPracticeNotXor)">
                        <img id="AndNotOr-id" src="media/imgs/basicLogicGates/AndNotOr_wPQ.svg" onclick="TableGenerator.createTable('circuit-practice-table-id',JsonTableDataPracticeAndNotOr)">
                        <img id="OrAndXor-id" src="media/imgs/basicLogicGates/OrAndXor_wPQ.svg" onclick="TableGenerator.createTable('circuit-practice-table-id',JsonTableDataPracticeOrAndXor)">
                        <img id="NotAndXorOr-id" src="media/imgs/basicLogicGates/NotAndXorOr_wPQ.svg" onclick="TableGenerator.createTable('circuit-practice-table-id',JsonTableDataPracticeNotAndXorOr)">
                        <img id="NotXorOrNand-id" src="media/imgs/basicLogicGates/NotXorOrNand_wPQ.svg" onclick="TableGenerator.createTable('circuit-practice-table-id',JsonTableDataPracticeNotXorOrNand)">
                        <img id="NandNotNand-id" src="media/imgs/basicLogicGates/NandNotNand_wPQ.svg" onclick="TableGenerator.createTable('circuit-practice-table-id',JsonTableDataPracticeNandNotNand)">
                        <img id="NorNandNxor-id" src="media/imgs/basicLogicGates/NorNandNxor_wPQ.svg" onclick="TableGenerator.createTable('circuit-practice-table-id',JsonTableDataPracticeNorNandNxor)">
                        <img id="AndOrNandNxorNandNor-id" src="media/imgs/basicLogicGates/AndOrNandNxorNandNor_wPQ.svg" onclick="TableGenerator.createTable('circuit-practice-table-id',JsonTableDataPracticeAndOrNandNxorNandNor)">
                        <img id="NorNorNor-id" src="media/imgs/basicLogicGates/NorNorNor_wPQ.svg" onclick="TableGenerator.createTable('circuit-practice-table-id',JsonTableDataPracticeNorNorNor)">
                        <img id="TwoToFourDecoder-id" src="media/imgs/basicLogicGates/TwoToFourDecoder_wPQ.svg" onclick="TableGenerator.createTable('circuit-practice-table-id',JsonTableDataPracticeTwoToFourDecoder)">
                        <img id="AndAndOrW3Inputs-id" src="media/imgs/basicLogicGates/AndAndOr_wPQ.svg" onclick="TableGenerator.createTable('circuit-practice-table-id',JsonTableDataPracticeAndAndOr)">
                    </div>
                </div>

                <div id="circuit-table-container-id" class="circuit-table-container">
                    <table id="circuit-practice-table-id" class="truth-table circuit-table" style="border-collapse: collapse">

                    </table>
                </div><br><br>

           
            </section>
        </div>
    </div>
</div>

        <script>
            function gatesIcsInit(){
			    //console.log("In onload='gatesIcsInit()' GatesIcs.html");
                //TableGenerator.createTable('basic-practice-table-id',JsonTableDataPractice74LS08);
                //PracticeTruthTableManager.create("basic","AND");
                addListenerToInputs();
            }
        </script>
</body>
</html>
